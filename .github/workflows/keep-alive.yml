name: Keep Alive — OrthoClinic

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping OrthoClinic Backend
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://ortho-backend.onrender.com/health)
          echo "ortho-backend: $STATUS"
          if [ "$STATUS" = "200" ]; then echo "✅ Backend ativo"; else echo "⚠️ Backend retornou $STATUS"; fi
      - name: Ping OrthoClinic Frontend
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://ortho-frontend.onrender.com)
          echo "ortho-frontend: $STATUS"
          if [ "$STATUS" = "200" ]; then echo "✅ Frontend ativo"; else echo "⚠️ Frontend retornou $STATUS"; fi
