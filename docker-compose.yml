version: "3.9"

services:
  backend:
    build: ./backend
    container_name: ortho_backend
    ports:
      - "8002:8000"
    volumes:
      - ./backend:/app
      - ortho_uploads:/app/uploads
      - ortho_db:/app/data
    environment:
      - DATABASE_URL=sqlite:////app/data/orthoclinic.db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      args:
        - NEXT_PUBLIC_API_URL=http://localhost:8002
    container_name: ortho_frontend
    ports:
      - "3002:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8002
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  ortho_uploads:
  ortho_db:
