<!DOCTYPE html>
<html>
<head>
    <title>Teste de Conexão API</title>
    <style>
        body { font-family: Arial; margin: 20px; }
        .test { margin: 10px 0; padding: 10px; border: 1px solid #ccc; }
        .ok { background: #90EE90; }
        .error { background: #FFB6C6; }
    </style>
</head>
<body>
    <h1>Teste de Conexão OrthoClinic API</h1>
    <div id="results"></div>
    
    <script>
        const results = document.getElementById('results');
        
        async function test() {
            // Teste 1: Verificar URL do backend
            const urls = [
                'http://localhost:8003',
                'http://127.0.0.1:8003',
                'http://0.0.0.0:8003',
            ];
            
            for (const url of urls) {
                const div = document.createElement('div');
                div.className = 'test';
                
                try {
                    const response = await fetch(`${url}/health`, {
                        method: 'GET',
                        headers: { 'Content-Type': 'application/json' }
                    });
                    div.textContent = `✅ ${url}/health → ${response.status}`;
                    div.classList.add('ok');
                } catch (e) {
                    div.textContent = `❌ ${url}/health → ${e.message}`;
                    div.classList.add('error');
                }
                results.appendChild(div);
            }
            
            // Teste 2: Login
            const div = document.createElement('div');
            div.className = 'test';
            try {
                const response = await fetch('http://localhost:8003/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: 'admin@test.com', password: 'admin123' })
                });
                const data = await response.json();
                div.textContent = `✅ POST /auth/login → ${response.status}`;
                div.classList.add('ok');
            } catch (e) {
                div.textContent = `❌ POST /auth/login → ${e.message}`;
                div.classList.add('error');
            }
            results.appendChild(div);
        }
        
        test();
    </script>
</body>
</html>
