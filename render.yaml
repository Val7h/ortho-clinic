services:
  # ── Backend (FastAPI) ──────────────────────────────────────────
  - type: web
    name: ortho-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: BACKEND_CORS_ORIGINS
        value: '["https://ortho-frontend.onrender.com"]'

  # ── Frontend (Next.js) — runtime nativo Node.js ───────────────
  - type: web
    name: ortho-frontend
    runtime: node
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build && cp -r .next/static .next/standalone/.next/ && mkdir -p .next/standalone/public && cp -r public/. .next/standalone/public/ 2>/dev/null || true
    startCommand: node .next/standalone/server.js
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://ortho-backend.onrender.com
      - key: NODE_VERSION
        value: "20"
      - key: PORT
        value: "3000"
      - key: HOSTNAME
        value: "0.0.0.0"
