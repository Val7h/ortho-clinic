services:
  # ── Backend (FastAPI) ──────────────────────────────────────────
  - type: web
    name: ortho-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: BACKEND_CORS_ORIGINS
        value: '["https://ortho-frontend.onrender.com"]'

  # ── Frontend (Next.js) ────────────────────────────────────────
  - type: web
    name: ortho-frontend
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    plan: free
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://ortho-backend.onrender.com
